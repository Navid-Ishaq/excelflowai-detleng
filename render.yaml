services:
  - type: web
    name: excelflow-ai-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run check:server && npm run test:ai
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: openai/gpt-5-mini
      - key: ALLOWED_ORIGINS
        value: https://excelflowai.detleng.com
      - key: AI_MEMORY_MB
        value: '96'
      - key: AI_DAILY_REQUESTS
        value: '100'
